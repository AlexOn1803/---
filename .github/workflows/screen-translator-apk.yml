name: Screen Translator APK

on:
  push:
    paths:
      - "screen-translator/**"
      - ".github/workflows/screen-translator-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: screen-translator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ScreenTranslator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-apk
          path: screen-translator/ScreenTranslator.apk
          if-no-files-found: error

      - name: Commit APK to the branch
        working-directory: .
        run: |
          mkdir -p apk
          cp screen-translator/ScreenTranslator.apk apk/ScreenTranslator.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add apk/ScreenTranslator.apk
          git commit -m "Update ScreenTranslator.apk [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
