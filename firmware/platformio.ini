; PlatformIO: pio run -d firmware -t upload
; (Arduino IDE: відкрийте firmware/ColdPullStation/ColdPullStation.ino)
[platformio]
src_dir = ColdPullStation

[env:nano]
platform = atmelavr
board = nanoatmega328new   ; для старих клонів: nanoatmega328
framework = arduino
lib_deps = olikraus/U8g2@^2.35.30
monitor_speed = 115200
